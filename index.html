<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>佳一宝宝 · 浪漫星河圣诞树</title>
<style>
  :root{
    --bg1:#08040c;
    --bg2:#160914;
    --gold:#ffe5bb;
    --pink:#ffb3d2;
    --rose:#ff8fc0;
    --white:#fff8f2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 18%, #1e1024 0%, #0a0510 32%, #050308 72%, #030206 100%);font-family:Georgia,"Times New Roman","PingFang SC","Songti SC",serif;color:#fff}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
  .overlay{position:fixed;inset:0;pointer-events:none}
  .top{
    position:absolute;top:6.5%;left:50%;transform:translateX(-50%);
    width:min(92vw,900px);text-align:center;
    text-shadow:0 0 14px rgba(255,173,203,.4),0 0 32px rgba(255,210,226,.3);
    animation:floatText 6s ease-in-out infinite;
  }
  .top .title{
    font-size:clamp(32px,6.4vw,72px);font-style:italic;font-weight:400;letter-spacing:.02em;
    color:var(--white);
    text-shadow:0 0 18px rgba(255,206,230,.45),0 0 60px rgba(255,190,214,.2);
  }
  .top .decor{margin:.6rem auto .5rem auto;height:1px;width:min(74vw,560px);position:relative;background:linear-gradient(90deg,transparent,rgba(255,220,230,.75),transparent)}
  .top .decor:before,.top .decor:after{content:"♡";position:absolute;top:-13px;color:#ffb7d8;font-size:18px}
  .top .decor:before{left:8%}
  .top .decor:after{right:8%}
  .top .name{
    font-size:clamp(24px,4.8vw,42px);letter-spacing:.18em;font-weight:500;color:#fff4f9;
    text-shadow:0 0 12px rgba(255,157,202,.55),0 0 28px rgba(255,227,189,.25);
  }
  .top .sub{
    margin-top:.8rem;font-size:clamp(12px,2.5vw,18px);letter-spacing:.08em;opacity:.88;color:#ffe8f2
  }
  .bottom{
    position:absolute;left:50%;bottom:4.5%;transform:translateX(-50%);
    width:min(92vw,920px);text-align:center;pointer-events:auto
  }
  .quote{
    display:inline-block;padding:.75rem 1.1rem;border-radius:999px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,226,235,.14);
    backdrop-filter: blur(8px);-webkit-backdrop-filter: blur(8px);
    color:#fff6fb;text-shadow:0 0 8px rgba(255,179,210,.22);
    font-size:clamp(12px,2.8vw,16px);letter-spacing:.04em
  }
  .controls{margin-top:1rem;display:flex;justify-content:center;gap:.65rem;flex-wrap:wrap}
  button{
    pointer-events:auto;appearance:none;border:1px solid rgba(255,225,236,.22);outline:none;
    color:#fff7fb;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
    padding:.7rem 1.1rem;border-radius:999px;font-size:13px;letter-spacing:.05em;
    box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 6px 20px rgba(0,0,0,.18);
    backdrop-filter: blur(10px);-webkit-backdrop-filter: blur(10px);
  }
  button:active{transform:translateY(1px) scale(.99)}
  .tip{margin-top:.75rem;font-size:12px;opacity:.68;letter-spacing:.1em;color:#ffe8f2}
  .santa{
    position:absolute;top:-1.4rem;left:50%;transform:translateX(-50%);
    font-size:clamp(18px,3vw,26px);opacity:.8;filter:drop-shadow(0 0 8px rgba(255,227,189,.35));
    animation:santaRide 8s linear infinite;
  }
  @keyframes floatText{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(4px)}}
  @keyframes santaRide{0%{margin-left:-18px;opacity:.25}10%{opacity:.8}90%{opacity:.8}100%{margin-left:18px;opacity:.25}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="top">
    <div class="santa">🛷 ✦</div>
    <div class="title">Merry Christmas</div>
    <div class="decor"></div>
    <div class="name">佳一宝宝</div>
    <div class="sub">满天星辰不及你，所有浪漫都只为你</div>
  </div>
  <div class="bottom">
    <div class="quote">比圣诞先抵达的，是送给你的偏爱</div>
    <div class="controls">
      <button id="spinBtn">暂停旋转</button>
      <button id="loveBtn">爱心星光</button>
      <button id="replayBtn">重播开场</button>
    </div>
    <div class="tip">左右拖动可旋转 · 点击画面可触发星光</div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const TAU = Math.PI * 2;
  const rand = (a=1,b=0)=> b + Math.random()*(a-b);
  const lerp = (a,b,t)=> a+(b-a)*t;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  let W=0,H=0,CX=0,CY=0,unit=0;
  function resize(){
    W = innerWidth; H = innerHeight; CX = W/2; CY = H*0.64; unit = Math.min(W,H);
    canvas.width = Math.round(W*DPR);
    canvas.height = Math.round(H*DPR);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize', resize, {passive:true});
  resize();

  const bodyPts=[];
  const ribbonPts=[];
  const basePts=[];
  const stars=[];
  const snow=[];
  const sparkleBursts=[];
  const heartPts=[];
  const meteors=[];

  const TREE_H = 2.38;
  const TREE_R = 1.25;
  const CAM = 5.7;
  const SCALE = ()=> Math.min(W,H)*0.26;

  function addBodyPoint(){
    const y = Math.pow(Math.random(),0.93)*TREE_H;
    const rMax = (1 - y/TREE_H) * TREE_R;
    const r = rMax * Math.sqrt(Math.random()) * rand(1,.25);
    const a = Math.random()*TAU;
    const tw = rand(1,.15);
    bodyPts.push({x:Math.cos(a)*r,y,z:Math.sin(a)*r,size:rand(2.5,.75),ph:Math.random()*TAU,tw,col:Math.random()<0.65?0:1});
  }
  function addRibbonPoint(){
    const t = Math.random();
    const loops = 5.65;
    const y = t*TREE_H;
    const r = (1 - y/TREE_H)*TREE_R*1.03 + rand(.06,-.06);
    const a = t*TAU*loops + rand(.24,-.24);
    ribbonPts.push({x:Math.cos(a)*r,y,z:Math.sin(a)*r,size:rand(3.2,1.2),ph:Math.random()*TAU,t});
  }
  function addBasePoint(){
    const ring = rand(1.85,.1);
    const a = Math.random()*TAU;
    const spread = rand(.45,-.45);
    basePts.push({x:Math.cos(a)*(ring+spread),y:-0.05-rand(.15),z:Math.sin(a)*(ring+spread),size:rand(2.8,.8),ph:Math.random()*TAU,col:Math.random()<0.5?0:1});
  }
  function addStar(){
    stars.push({x:Math.random()*W,y:Math.random()*H*0.9,s:rand(2.2,.5),ph:Math.random()*TAU,d:rand(1.2,.35)});
  }
  function addSnow(){
    snow.push({x:Math.random()*W,y:Math.random()*H,s:rand(2.4,.5),v:rand(32,8),dr:rand(.18,-.18),ph:Math.random()*TAU});
  }
  function buildScene(){
    bodyPts.length=0; ribbonPts.length=0; basePts.length=0; stars.length=0; snow.length=0; heartPts.length=0; meteors.length=0;
    for(let i=0;i<12500;i++) addBodyPoint();
    for(let i=0;i<4300;i++) addRibbonPoint();
    for(let i=0;i<5000;i++) addBasePoint();
    for(let i=0;i<160;i++) addStar();
    for(let i=0;i<160;i++) addSnow();
    for(let i=0;i<220;i++){
      const a = Math.random()*TAU;
      const x = Math.sin(a)*16;
      const y = -(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));
      heartPts.push({x:x/11,y:y/11,size:rand(2.6,1.1),ph:Math.random()*TAU});
    }
  }
  buildScene();

  function meteorNow(){
    meteors.push({x:rand(W*0.95,W*0.15),y:rand(H*0.35,H*0.06),vx:rand(-620,-280),vy:rand(190,60),life:1});
  }
  setInterval(()=>{ if(Math.random()<0.75) meteorNow(); }, 2200);

  function glow(x,y,r,c0,c1='transparent'){
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,c0); g.addColorStop(1,c1);
    ctx.fillStyle=g;
    ctx.fillRect(x-r,y-r,r*2,r*2);
  }

  function project(p,rotY,offsetY=0){
    const cy=Math.cos(rotY), sy=Math.sin(rotY);
    let x = p.x*cy - p.z*sy;
    let z = p.x*sy + p.z*cy;
    let y = p.y + offsetY;
    // slight tilt toward viewer
    const tilt=-0.18;
    const ct=Math.cos(tilt), st=Math.sin(tilt);
    const yt = y*ct - z*st;
    const zt = y*st + z*ct;
    const depth = CAM - zt;
    const sc = SCALE() / depth;
    return {x:CX + x*sc, y:CY - yt*sc, sc, depth, z:zt};
  }

  let rotY = 0;
  let autoSpin = true;
  let dragging = false;
  let lastX = 0;
  let introStart = performance.now();
  let lovePulse = 0;
  let sparklePulse = 0;

  function triggerLove(){
    lovePulse = 1;
    sparklePulse = 1;
    for(let i=0;i<4;i++){
      sparkleBursts.push({life:1, ring:i*0.08, rot:Math.random()*TAU});
    }
  }
  function replayIntro(){ introStart = performance.now(); }

  canvas.addEventListener('pointerdown', e=>{dragging=true; lastX=e.clientX; canvas.setPointerCapture(e.pointerId); triggerLove();});
  canvas.addEventListener('pointermove', e=>{ if(!dragging) return; const dx=e.clientX-lastX; lastX=e.clientX; rotY += dx*0.0085; });
  function endDrag(){dragging=false}
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  document.getElementById('spinBtn').onclick=(e)=>{ autoSpin=!autoSpin; e.target.textContent=autoSpin?'暂停旋转':'继续旋转'; };
  document.getElementById('loveBtn').onclick=triggerLove;
  document.getElementById('replayBtn').onclick=replayIntro;

  function drawBackground(t){
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0a0711');
    bg.addColorStop(.35,'#09050d');
    bg.addColorStop(1,'#040307');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    glow(CX, H*0.18, unit*0.28, 'rgba(255,158,205,0.09)');
    glow(CX, CY+unit*0.18, unit*0.42, 'rgba(255,140,190,0.05)');

    ctx.globalCompositeOperation = 'lighter';
    for(const s of stars){
      const a = 0.35 + 0.65*(0.5+0.5*Math.sin(t*1.2*s.d + s.ph));
      ctx.globalAlpha = a;
      const r = s.s * (1 + 0.28*Math.sin(t*2+s.ph));
      glow(s.x, s.y, r*4, 'rgba(255,210,226,0.09)');
      ctx.fillStyle = 'rgba(255,246,250,0.95)';
      ctx.fillRect(s.x-r/2, s.y-r/2, r, r);
      if(s.s > 1.3){
        ctx.strokeStyle = 'rgba(255,236,214,'+(0.2+a*0.3)+')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(s.x-r*2.5, s.y); ctx.lineTo(s.x+r*2.5, s.y);
        ctx.moveTo(s.x, s.y-r*2.5); ctx.lineTo(s.x, s.y+r*2.5);
        ctx.stroke();
      }
    }

    for(let i=meteors.length-1;i>=0;i--){
      const m=meteors[i];
      m.life -= 0.012;
      if(m.life<=0){ meteors.splice(i,1); continue; }
      m.x += m.vx/60; m.y += m.vy/60;
      const len = 90;
      const grad = ctx.createLinearGradient(m.x, m.y, m.x-len, m.y-len*0.35);
      grad.addColorStop(0,'rgba(255,245,245,'+(0.9*m.life)+')');
      grad.addColorStop(.25,'rgba(255,200,220,'+(0.5*m.life)+')');
      grad.addColorStop(1,'rgba(255,200,220,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(m.x,m.y);
      ctx.lineTo(m.x-len,m.y-len*0.35);
      ctx.stroke();
    }

    for(const flake of snow){
      flake.y += flake.v/60;
      flake.x += Math.sin(t*0.9 + flake.ph)*flake.dr;
      if(flake.y > H+10){ flake.y = -10; flake.x = Math.random()*W; }
      ctx.globalAlpha = 0.25 + (flake.s/2.4)*0.5;
      ctx.fillStyle = 'rgba(255,246,250,0.9)';
      ctx.beginPath(); ctx.arc(flake.x,flake.y,flake.s/2,0,TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawBaseGalaxy(t, intro){
    const reveal = clamp((intro-0.18)/0.82,0,1);
    ctx.globalCompositeOperation='lighter';
    for(const p of basePts){
      const q = project(p, rotY*0.52, -0.03);
      if(q.depth<0.3) continue;
      const flick = 0.45 + 0.55*(0.5+0.5*Math.sin(t*2.2 + p.ph));
      const alpha = reveal * (0.09 + flick*0.18) * (1 + lovePulse*0.25);
      ctx.globalAlpha = alpha;
      const size = p.size*q.sc*0.72;
      ctx.fillStyle = p.col===0 ? '#ffb8d7' : '#fff1d7';
      ctx.fillRect(q.x,q.y,size,size);
      if(size>1.6) glow(q.x,q.y,size*5,p.col===0?'rgba(255,166,206,0.10)':'rgba(255,236,194,0.08)');
    }
    // rotating halo rings
    for(let ring=0; ring<3; ring++){
      const rr = unit*(0.145 + ring*0.028);
      ctx.globalAlpha = reveal*(0.08 + ring*0.02)*(1+lovePulse*0.3);
      ctx.strokeStyle = ring%2 ? 'rgba(255,186,215,.42)' : 'rgba(255,232,197,.36)';
      ctx.lineWidth = 1.3 + ring*0.4;
      ctx.beginPath();
      for(let a=0;a<=TAU+0.02;a+=0.04){
        const wob = Math.sin(a*4 + t*1.2 + ring)*6;
        const x = CX + Math.cos(a + t*(0.12 + ring*0.025))*rr;
        const y = CY + unit*0.09 + Math.sin(a)*rr*0.16 + wob*0.12;
        a===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
  }

  function drawTree(t, intro){
    const revealY = TREE_H * clamp((intro-0.06)/0.94,0,1);
    ctx.globalCompositeOperation='lighter';

    // body points
    for(const p of bodyPts){
      if(p.y > revealY) continue;
      const q = project(p, rotY, 0);
      if(q.depth < 0.25) continue;
      const twinkle = 0.42 + 0.58*(0.5+0.5*Math.sin(t*(1.2+p.tw) + p.ph));
      const fadeTop = 0.38 + 0.62*(1 - p.y/TREE_H);
      const alpha = (0.10 + twinkle*0.34)*fadeTop*(1+sparklePulse*0.22);
      ctx.globalAlpha = alpha;
      const size = Math.max(.6, p.size*q.sc*0.55*(1+sparklePulse*0.15));
      ctx.fillStyle = p.col===0 ? '#ffd8e7' : '#fff5e7';
      ctx.fillRect(q.x,q.y,size,size);
      if(size>1.4) glow(q.x,q.y,size*4,p.col===0?'rgba(255,160,205,0.09)':'rgba(255,240,210,0.08)');
    }

    // ribbon points
    for(const p of ribbonPts){
      if(p.y > revealY + 0.08) continue;
      const q = project(p, rotY, 0);
      if(q.depth < 0.25) continue;
      const pulse = 0.45 + 0.55*(0.5+0.5*Math.sin(t*3 + p.ph));
      const alpha = 0.16 + pulse*0.62;
      ctx.globalAlpha = alpha;
      const size = Math.max(.9,p.size*q.sc*0.72*(1+sparklePulse*0.26));
      ctx.fillStyle = (p.t % 0.18 < 0.09) ? '#fff0d2' : '#ffb0d2';
      ctx.fillRect(q.x,q.y,size*1.1,size*1.1);
      glow(q.x,q.y,size*5,(p.t % 0.18 < 0.09)?'rgba(255,233,187,0.14)':'rgba(255,157,202,0.12)');
    }

    // trunk faint glow at core
    ctx.globalAlpha = clamp((intro-0.22)/0.78,0,1)*0.25;
    glow(CX, CY-unit*0.13, unit*0.17, 'rgba(255,223,195,0.08)');

    // top star
    if(intro > 0.4){
      const q = project({x:0,y:TREE_H+0.22,z:0}, rotY, 0);
      const r = 10 + 4*Math.sin(t*3.3) + lovePulse*12;
      ctx.globalAlpha = clamp((intro-0.45)/0.55,0,1);
      glow(q.x,q.y,r*5,'rgba(255,220,175,0.18)');
      glow(q.x,q.y,r*2.7,'rgba(255,244,226,0.25)');
      ctx.save();
      ctx.translate(q.x,q.y);
      ctx.rotate(t*0.25);
      ctx.strokeStyle='rgba(255,248,233,.95)';
      ctx.lineWidth=1.5;
      for(let k=0;k<2;k++){
        ctx.beginPath();
        for(let i=0;i<8;i++){
          const a = i*Math.PI/4 + k*Math.PI/8;
          const rr = i%2===0 ? r : r*0.32;
          const px = Math.sin(a)*rr;
          const py = Math.cos(a)*rr;
          i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawLoveBurst(t){
    if(lovePulse <= 0.001 && sparkleBursts.length===0) return;
    ctx.globalCompositeOperation='lighter';

    // floating heart made of particles above tree
    if(lovePulse > 0.001){
      const a = clamp(lovePulse,0,1);
      const heartScale = unit*0.085*(1+0.25*(1-a));
      const offsetY = CY - unit*0.27 - (1-a)*18;
      for(const hp of heartPts){
        const x = CX + hp.x*heartScale;
        const y = offsetY + hp.y*heartScale;
        const tw = 0.4 + 0.6*(0.5+0.5*Math.sin(performance.now()/320 + hp.ph));
        ctx.globalAlpha = a*(0.2 + tw*0.7);
        const size = hp.size*(0.85+a*0.8);
        ctx.fillStyle = Math.random()<0.5 ? '#ffc0db' : '#fff1d7';
        ctx.fillRect(x,y,size,size);
      }
      glow(CX, offsetY, heartScale*1.55, 'rgba(255,160,205,0.09)');
      lovePulse *= 0.985;
    }

    for(let i=sparkleBursts.length-1;i>=0;i--){
      const b = sparkleBursts[i];
      b.life -= 0.016;
      if(b.life<=0){sparkleBursts.splice(i,1);continue;}
      const alpha = b.life;
      const radius = unit*(0.065 + (1-b.life)*0.13 + b.ring);
      ctx.globalAlpha = 0.35*alpha;
      ctx.strokeStyle = i%2 ? 'rgba(255,203,225,.8)' : 'rgba(255,238,200,.75)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for(let a=0;a<=TAU+0.02;a+=0.14){
        const rr = radius + Math.sin(a*3 + b.rot + performance.now()/500)*4;
        const x = CX + Math.cos(a+b.rot)*rr;
        const y = CY - unit*0.1 + Math.sin(a+b.rot)*rr*0.42;
        a===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.stroke();
    }

    sparklePulse *= 0.975;
  }

  function drawGroundMist(){
    ctx.globalCompositeOperation='screen';
    glow(CX, CY+unit*0.16, unit*0.36, 'rgba(255,194,221,0.06)');
    glow(CX, CY+unit*0.18, unit*0.26, 'rgba(255,236,200,0.06)');
  }

  function frame(now){
    requestAnimationFrame(frame);
    const t = now/1000;
    const intro = clamp((now-introStart)/3200,0,1);
    if(autoSpin && !dragging) rotY += 0.0036;

    drawBackground(t);
    drawGroundMist();
    drawBaseGalaxy(t, intro);
    drawTree(t, intro);
    drawLoveBurst(t);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation='source-over';
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
